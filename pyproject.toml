[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-management"
version = "1.0.0"
description = "Desktop restaurant management system built with Qt/QML, Python and SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
restaurant-management = "restaurant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restaurant = ["db/schema/*.sql", "qml/**/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
